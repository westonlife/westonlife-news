name: Add Weston Garden Section to Homepage

on:
  push:
    paths:
      - '.github/workflows/add-weston-garden.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Insert garden section and create cover images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re, base64

          home = Path('index.html')
          article = Path('weston-yanghua.html')
          if not home.exists() or not article.exists():
              raise SystemExit('Missing index.html or weston-yanghua.html; no website files changed.')

          page = article.read_text(encoding='utf-8')
          def export_article_image(alt, dest):
              # Reuse the exact cover images already inside the uploaded article.
              for match in re.finditer(r'<img\b[^>]*>', page, re.IGNORECASE | re.DOTALL):
                  tag = match.group(0)
                  title = re.search(r'\balt="([^"]*)"', tag)
                  encoded = re.search(r'\bsrc="data:image/webp;base64,([A-Za-z0-9+/=]+)"', tag)
                  if title and encoded and alt in unescape(title.group(1)):
                      out = Path(dest)
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_bytes(base64.b64decode(encoded.group(1)))
                      return
              raise SystemExit('Cannot find image in article: ' + alt)

          export_article_image('AI效果图：花园里的午后', 'assets/wyh-garden-cover.webp')
          export_article_image('AI效果图：男主人的盆景书桌', 'assets/wyh-bonsai-cover.webp')
          export_article_image('窗台盆栽与自然光', 'assets/wyh-plant-photo.webp')

          section = '''<!-- WESTON-YANGHUA-HOMEPAGE-START -->
          <style>
          #wyh-home{max-width:1100px;margin:32px auto 36px;padding:26px;background:#f3f3ea;border:1px solid #d7decf;border-radius:15px;color:#2a4435;font-family:Georgia,"Noto Serif CJK SC",serif;box-sizing:border-box}
          #wyh-home *{box-sizing:border-box}#wyh-home a{text-decoration:none;color:inherit}#wyh-home .wyh-head{text-align:center;padding:12px 12px 22px}
          #wyh-home .wyh-label{font:11px Arial,sans-serif;letter-spacing:.19em;color:#9d755a}#wyh-home h2{font-size:clamp(32px,5vw,49px);font-weight:500;line-height:1.3;margin:12px 0;color:#315843}
          #wyh-home .wyh-sub{font-size:clamp(18px,2.7vw,27px);margin:4px 0 9px;color:#875d5f}#wyh-home .wyh-desc{font-size:15px;line-height:1.9;color:#6e796c;max-width:700px;margin:0 auto}
          #wyh-home .wyh-grid{display:grid;grid-template-columns:1.3fr 1fr 0.65fr;gap:10px;margin:12px 0 21px}
          #wyh-home figure{position:relative;height:275px;margin:0;overflow:hidden;border-radius:8px;background:#dce7d6}
          #wyh-home figure img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .3s}#wyh-home figure:hover img{transform:scale(1.035)}
          #wyh-home figcaption{position:absolute;left:9px;bottom:9px;color:#26412f;background:rgba(255,253,246,.94);font:12px Arial,sans-serif;padding:7px 9px;border-radius:4px}
          #wyh-home .wyh-cta{display:table;margin:0 auto;background:#315843;color:white;padding:13px 28px;border-radius:28px;font:14px Arial,sans-serif}
          #wyh-home .wyh-note{text-align:center;color:#8b9388;font:11px/1.6 Arial,sans-serif;margin:14px 0 0}
          @media(max-width:640px){#wyh-home{margin:25px 10px;padding:16px}#wyh-home .wyh-grid{grid-template-columns:1fr 1fr}#wyh-home figure{height:190px}#wyh-home figure:last-child{grid-column:1/-1;height:165px}#wyh-home figcaption{font-size:10px}}
          </style>
          <section id="wyh-home" aria-label="Weston养花养人">
            <div class="wyh-head"><div class="wyh-label">WESTON LIFE · GARDEN & HOME</div>
              <h2>Weston养花养人</h2><p class="wyh-sub">Weston的秋天，不止有红叶</p>
              <p class="wyh-desc">从秋日庭院、窗边花草，到男主人的盆景书房和孩子床头的一点绿色。花草不只是装饰，也是日常生活里最温柔的陪伴。</p>
            </div>
            <a href="weston-yanghua.html" aria-label="进入Weston养花养人整篇文章">
              <div class="wyh-grid">
                <figure><img src="assets/wyh-garden-cover.webp" alt="秋日花园生活空间AI效果图" loading="lazy"><figcaption>秋日梦想花园 · 场景示意</figcaption></figure>
                <figure><img src="assets/wyh-bonsai-cover.webp" alt="男主人的盆景书桌AI效果图" loading="lazy"><figcaption>男主人的盆景书房 · 场景示意</figcaption></figure>
                <figure><img src="assets/wyh-plant-photo.webp" alt="用户提供的窗边植物真实照片" loading="lazy"><figcaption>窗边绿意 · 实拍</figcaption></figure>
              </div>
            </a>
            <a class="wyh-cta" href="weston-yanghua.html">阅读整篇文章 · 查看花草图鉴 →</a>
            <p class="wyh-note">照片中包含读者提供的实拍与标注的 AI 空间构想图</p>
          </section>
          <!-- WESTON-YANGHUA-HOMEPAGE-END -->
          '''

          current = home.read_text(encoding='utf-8')
          target = '<!-- WESTON-MA-REAL-ESTATE-START -->'
          begin = '<!-- WESTON-YANGHUA-HOMEPAGE-START -->'
          end = '<!-- WESTON-YANGHUA-HOMEPAGE-END -->'
          if target not in current:
              raise SystemExit('Cannot locate real estate section; homepage left unchanged.')
          if begin in current:
              if end not in current:
                  raise SystemExit('Incomplete existing garden markers; homepage left unchanged.')
              start = current.index(begin)
              finish = current.index(end, start) + len(end)
              updated = current[:start] + section.strip() + current[finish:]
          else:
              updated = current.replace(target, section.strip() + '\n' + target, 1)

          assert updated.count(begin) == 1
          assert updated.index(begin) < updated.index(target)
          home.write_text(updated, encoding='utf-8')
          print('Garden inserted immediately before MA real estate; all existing sections preserved.')
          PY
      - name: Commit website updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/wyh-garden-cover.webp assets/wyh-bonsai-cover.webp assets/wyh-plant-photo.webp
          if git diff --cached --quiet; then
            echo "Garden already installed."
          else
            git commit -m "Add Weston garden column between Coco and MA real estate"
            git push
          fi
