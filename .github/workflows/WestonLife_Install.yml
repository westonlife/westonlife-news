name: Weston Life - Learjet deep report 2-day headline 7-day archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/westonlife-learjet-48h.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-headline-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install article, headline and history link
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          exec(base64.b64decode('').decode('utf-8'))
          PY
      - name: Commit only our three files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learjet-headline-2026.js news/news-2026-11-01-learjet-bahamas-crash.html
          if ! git diff --cached --quiet; then
            git commit -m 'Use monochrome Learjet deep report with headline and 7-day archive'
            git push
          fi
