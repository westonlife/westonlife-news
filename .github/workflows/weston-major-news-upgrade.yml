name: Weston Life - Major News Editorial Upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weston-major-news-upgrade.yml'
permissions:
  contents: write
concurrency:
  group: weston-major-news-upgrade
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install breaking-news search and clear fake article cards
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import ast, base64, zlib, re
          root=Path.cwd()
          p=root/'scripts'/'generate_news.py'
          assert p.exists(), 'scripts/generate_news.py missing'
          s=p.read_text('utf-8')
          marker='# WESTON-EDITORIAL-2026-V2:'
          extra=zlib.decompress(base64.b64decode('')).decode('utf-8')
          if marker not in s:
              pattern=r'if len\(rows\) != 15 or any\(not safe_photo\(a\.get\("image", ""\)\) for a in rows\):'
              assert len(re.findall(pattern,s))==1, 'Rows validation changed: inspect manually'
              s=re.sub(pattern,'if not rows or len(rows) > 15 or any(not safe_photo(a.get("image", "")) for a in rows):',s)
              s=s.replace('Exactly 15 real downloaded photos required; no HTML files changed','Only verified pictured reports allowed; previous edition retained')
              assert '"section": NEWS_SLOTS[i-1]["name"],' in s
              s=s.replace('"section": NEWS_SLOTS[i-1]["name"],','"section": a.get("topic", "World News / Global"),',1)
              assert '"topic": NEWS_SLOTS[i-1]["name"],' in s
              s=s.replace('"topic": NEWS_SLOTS[i-1]["name"],','"topic": a.get("topic", "World News / Global"),',1)
              orig='    local = "".join(all_items[:5])\n    world = "".join(all_items[5:])'
              assert orig in s, 'Homepage split changed'
              s=s.replace(orig,'    local_count = len(groups[0][1])\n    local = "".join(all_items[:local_count])\n    world = "".join(all_items[local_count:])',1)
              anchor='\nif __name__ == "__main__":'
              assert s.count(anchor)==1
              s=s.replace(anchor,'\n\n'+extra+'\n'+anchor,1)
              ast.parse(s)
              p.write_text(s,'utf-8')
              print('PUBLISHER UPGRADED: authentic news, major headlines first, top 3 cards')
          else:
              print('PUBLISHER ALREADY UPGRADED')
          
          # Remove existing source directory placeholders for 2026-10-24. Genuine reports are retained.
          def remove_false_stories(text):
              # All placeholders use Weston Life as the source; true Weston Life editorial is elsewhere.
              before=text
              text=re.sub(r'<a class="wl-story"\s+href="news-2026-10-24\.html#story-(?:3|6)".*?</a>', '', text, flags=re.S)
              text=re.sub(r'<article class="item" id="story-(?:3|6)">.*?</article>', '', text, flags=re.S)
              return text,before!=text
          
          for name in ('index.html','news-2026-10-24.html'):
              f=root/name
              if f.exists():
                  original=f.read_text('utf-8')
                  cleaned,changed=remove_false_stories(original)
                  if changed:
                      f.write_text(cleaned,'utf-8')
                  print(name,'existing directory cards cleaned:',changed)
          PYCODE
      - name: Confirm publisher syntax and logic
        run: |
          python -m py_compile scripts/generate_news.py
          python scripts/generate_news.py --check
      - name: Save publisher and homepage corrections
        shell: bash
        run: |
          git config user.name "Weston Life News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_news.py index.html news-2026-10-24.html
          if ! git diff --cached --quiet; then
            git commit -m "Prioritize major genuine news and remove fake article entries"
            git push origin HEAD:main
          else
            echo "Already updated"
          fi
