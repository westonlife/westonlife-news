      - name: Commit and deploy homepage update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html westonlife-special-20261103.js assets/news-2026-11-03-hacker.jpg assets/news-2026-11-03-pope-vote.svg news/news-2026-11-03-binance-cyber.html news/news-2026-11-03-pope-vote.html
