name: Weston Life - Learjet 60 headline for two days
on:
  push:
    paths:
      - '.github/workflows/westonlife-learjet-48h.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-learjet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add full article and headline without touching existing news
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          exec(base64.b64decode('').decode('utf-8'))
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learjet-headline-2026.js news/news-2026-11-01-learjet-bahamas-crash.html
          if ! git diff --cached --quiet; then
            git commit -m 'Feature Learjet crash report for Nov 2-3 without changing other news'
            git push
          fi
