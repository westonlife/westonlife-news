
name: Weston Life Daily News

on:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * *'

permissions:
  contents: write

concurrency:
  group: weston-life-news
  cancel-in-progress: false

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate verified news
        run: python scripts/generate_news.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Update daily oil price headline
        run: python scripts/add_oil_headline.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Save updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html news-*.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Weston Life daily news"
            git push
          else
            echo "No website changes to save"
          fi
