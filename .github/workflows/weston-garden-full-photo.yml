name: Weston Garden Full Width Photo
on:
  push:
    paths:
      - '.github/workflows/weston-garden-full-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update only garden card
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          f=Path('index.html')
          s=f.read_text(encoding='utf-8')
          start='<!-- WESTON-YANGHUA-HOMEPAGE-START -->'
          end='<!-- WESTON-YANGHUA-HOMEPAGE-END -->'
          assert s.count(start)==1 and s.count(end)==1, 'Markers not found uniquely'
          assert Path('weston-garden-cover.jpg').is_file(), 'Upload cover JPG to root first'
          a=s.index(start)+len(start)
          b=s.index(end,a)
          assert 'weston-garden.html' in s[a:b], 'Unexpected garden card'
          new=base64.b64decode('').decode('utf-8')
          f.write_text(s[:a]+new+s[b:],encoding='utf-8')
          PYCODE
      - name: Commit only index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use full width autumn garden photo"
            git push
          fi
