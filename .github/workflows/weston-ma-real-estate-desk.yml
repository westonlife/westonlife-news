name: Weston Life - Massachusetts Real Estate Desk
on:
  push:
    paths:
      - '.github/workflows/weston-ma-real-estate-desk.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 22,23 * * *'
permissions:
  contents: write
concurrency:
  group: weston-life-news
  cancel-in-progress: false
jobs:
  market-section:
