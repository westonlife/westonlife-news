      - name: Update Massachusetts property market before Weston School
        if: github.event_name != 'schedule' || steps.localtime.outputs.hour == '18'
        timeout-minutes: 14
        shell: bash
        run: |
          python -m py_compile scripts/generate_ma_real_estate.py
          python scripts/generate_ma_real_estate.py
      - name: Publish updates
        if: github.event_name != 'schedule' || steps.localtime.outputs.hour == '18'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/generate_ma_real_estate.py
          if ! git diff --cached --quiet; then
            git commit -m "Add Massachusetts housing market before Today Weston School"
            git push
          else
            echo 'MA real estate data already up to date'
          fi
