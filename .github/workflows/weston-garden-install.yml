name: Install Weston Four-Season Garden Column

on:
  push:
    paths:
      - '.github/workflows/weston-garden-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current website safely
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Change ONLY the old garden homepage block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          home=Path('index.html')
          article=Path('weston-garden.html')
          if not article.exists():
              raise SystemExit('STOP: Upload weston-garden.html to repository root before running installer.')
          if not home.exists():
              raise SystemExit('STOP: Current index.html not found; nothing modified.')
          source=home.read_text(encoding='utf-8')
          begin='<!-- WESTON-YANGHUA-HOMEPAGE-START -->'
          end='<!-- WESTON-YANGHUA-HOMEPAGE-END -->'
          if source.count(begin)!=1 or source.count(end)!=1:
              raise SystemExit('STOP: exact old section markers not found; no changes performed.')
          s=source.index(begin)
          e=source.index(end,s)+len(end)
          before=source[:s]
          after=source[e:]
          replacement='<!-- WESTON-YANGHUA-HOMEPAGE-START -->\n<style>\n#wyh-home{max-width:1100px;margin:24px auto 30px;padding:12px 15px;background:#f7f8f3;border:1px solid #dce3d8;border-radius:12px;color:#2c4634;font-family:Georgia,"Noto Serif CJK SC",serif;box-sizing:border-box}\n#wyh-home *{box-sizing:border-box}#wyh-home a{text-decoration:none;color:inherit}\n#wyh-home .garden-main{display:flex;align-items:stretch;overflow:hidden;border-radius:9px;background:#fff;min-height:145px}\n#wyh-home .garden-main img{width:37%;height:auto;max-height:188px;object-fit:cover}\n#wyh-home .garden-detail{padding:19px 22px;flex:1}\n#wyh-home .garden-kicker{font:700 10px Arial,sans-serif;letter-spacing:.15em;color:#9c815f}\n#wyh-home h2{font-size:clamp(21px,3vw,31px);font-weight:500;margin:7px 0;line-height:1.35}\n#wyh-home p{font:14px/1.65 Arial,sans-serif;color:#667567;margin:0}\n#wyh-home .garden-cta{display:inline-block;color:#325f43;font:bold 12px Arial,sans-serif;margin-top:11px}\n#wyh-home .garden-archive{font:12px Arial,sans-serif;text-align:right;padding:10px 4px 0;color:#66766a}\n#wyh-home .garden-archive a{text-decoration:underline}\n@media(max-width:620px){#wyh-home{margin:18px 10px;padding:8px}#wyh-home .garden-main{min-height:125px}#wyh-home .garden-main img{width:35%}#wyh-home .garden-detail{padding:12px}#wyh-home h2{font-size:19px}#wyh-home p{font-size:12px;line-height:1.5}#wyh-home .garden-cta{margin-top:6px}}\n</style>\n<section id="wyh-home" aria-label="Weston四季庄园养护手册">\n <a class="garden-main" href="weston-garden.html">\n  <img src="assets/hero.jpg" alt="Weston 秋季树木庭院" loading="lazy">\n  <div class="garden-detail"><span class="garden-kicker">WESTON LIFE · YEAR-ROUND GARDEN CARE</span>\n  <h2>Weston 四季庄园养护手册</h2>\n  <p>先做好秋季入冬准备，再看春夏养护、危险植物、扫雪标杆、融雪剂与本地服务商参考价格。</p>\n  <span class="garden-cta">阅读完整图文手册 →</span></div>\n </a><p class="garden-archive">历史文章：<a href="weston-yanghua.html">Weston养花养人</a></p>\n</section>\n<!-- WESTON-YANGHUA-HOMEPAGE-END -->'
          updated=before+replacement+after
          assert updated[:s]==before and updated[s+len(replacement):]==after
          assert source.count('id="wyh-home"')==1
          assert updated.count('id="wyh-home"')==1
          # Everything outside these two exact markers remains character-for-character identical.
          home.write_text(updated,encoding='utf-8')
          archive=Path('weston-yanghua.html')
          if not archive.exists() or not archive.read_text(encoding='utf-8').strip():
              archive.write_text('<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weston养花养人｜历史文章｜Weston Life</title><style>body{margin:0;background:#fbfaf4;color:#354337;font:17px/1.85 Georgia,"Songti SC",serif}main{max-width:850px;padding:35px 20px;margin:auto}h1{font-size:clamp(30px,5vw,54px);font-weight:normal}.hero{width:100%;max-height:460px;object-fit:cover;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid img{width:100%;height:235px;object-fit:cover;border-radius:10px}a{color:#3a6c4a}small{color:#68746d}@media(max-width:600px){.grid{grid-template-columns:1fr}.grid img{height:auto}}</style></head><body><main><p><a href="index.html">← Weston Life</a> · 历史文章 / Archive</p><h1>Weston养花养人</h1><p>Weston的秋天，不止有红叶。</p><img class="hero" src="assets/wyh-garden-cover.webp" alt="秋日梦想花园，构想图"><p>从秋日庭院、窗边花草，到男主人的盆景书房和孩子床头的一点绿色。花草不只是装饰，也是日常生活里最温柔的陪伴。</p><div class="grid"><figure><img src="assets/wyh-bonsai-cover.webp" alt="盆景书房"><figcaption>盆景书房 · 视觉构想</figcaption></figure><figure><img src="assets/wyh-plant-photo.webp" alt="窗边花草"><figcaption>窗边绿意 · 实拍</figcaption></figure></div><p>这篇旧栏目已从首页移入历史留档，内容保留供读者回顾。</p><p><a href="weston-garden.html">阅读新栏目：Weston 四季庄园养护手册 →</a></p><small>Weston Life · Garden & Home · Archive</small></main></body></html>',encoding='utf-8')
          print('Installed new garden card only; all counter and other content untouched.')
          print('Before length:',len(source),'after:',len(updated))
          PY
      - name: Commit ONLY modified homepage and repaired archive if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html weston-yanghua.html
          if git diff --cached --quiet; then
            echo "Already installed; no changes to make"
          else
            git commit -m "Replace only Weston Yanghua home card with four-season garden guide"
            git push
          fi
