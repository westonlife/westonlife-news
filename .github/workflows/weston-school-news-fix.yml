name: Weston Life - School News and Real Estate Fix
on:
  push:
    paths:
      - '.github/workflows/weston-school-news-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weston-school-news-fix
  cancel-in-progress: false
jobs:
  install-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get Weston Life repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install safer news and separate Weston school
        shell: bash
        run: |
          python - <<'PYNEWSFIX'
          from pathlib import Path
          import base64, zlib, ast
          path=Path('scripts/generate_news.py')
          s=path.read_text(encoding='utf-8')
          marker='# WESTON-LIFE-SCHOOL-NEWS-V3:'
          append=zlib.decompress(base64.b64decode('')).decode('utf-8')
          if marker not in s:
              anchor='if __name__ == "__main__":'
              assert anchor in s, 'Could not locate end-of-file execution guard'
              s=s.replace(anchor, append + '\n\n' + anchor, 1)
              ast.parse(s)
              path.write_text(s, encoding='utf-8')
              print('Installed dedicated Today Weston School news and verified-source rules')
          else:
              print('News V3 is already present; no duplicate installation')
          PYNEWSFIX
      - name: Check Python script syntax
        run: python -m py_compile scripts/generate_news.py
      - name: Refresh website with new editorial rules
        id: refresh
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/generate_news.py
      - name: Restore commodity price links
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        run: python scripts/add_oil_headline.py
      - name: Commit updated news program and website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Separate Today Weston School, improve original news sources and housing coverage"
            git push
          fi
