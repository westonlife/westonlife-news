name: Weston Life - Repair Popularity Plus 11

on:
  push:
    paths:
      - '.github/workflows/westonlife-counter-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: westonlife-counter-repair
  cancel-in-progress: false

jobs:
  fix-popularity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Repair only the existing popularity counter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          start = "<!-- WL-COUNTER-PLUS11-FROZEN -->"
          end = "<!-- WL-COUNTER-PLUS11-FROZEN-END -->"
          if html.count(start) != 1 or html.count(end) != 1:
              raise SystemExit(
                  "STOP: expected counter markers not found exactly once; no site changes made."
              )
          left = html.index(start)
          right = html.index(end, left) + len(end)

          counter = r"""<!-- WL-COUNTER-PLUS11-FROZEN -->
          <div id="wl-counter" style="padding:12px 18px;background:#f5efdf;color:#315c41;font-size:14px;text-align:left;">
            <span id="busuanzi_site_pv" style="display:none">加载中…</span>
            人气值：<span id="wl-popularity">27,110</span>
          </div>
          <script>
          (function () {
            var baselinePV = 69;
            var baselinePopularity = 27110;
            var box = document.getElementById('wl-counter');
            var pvNode = document.getElementById('busuanzi_site_pv');
            var label = document.getElementById('wl-popularity');
            if (!box || !pvNode || !label) return;
            document.body.prepend(box);

            // Keep a browser-local fallback when the shared service cannot respond.
            // This fallback is NOT a global visit counter.
            var storageKey = 'westonlife-popularity-plus11-v1';
            var displayed = baselinePopularity;
            try {
              var saved = Number(localStorage.getItem(storageKey));
              if (Number.isSafeInteger(saved) && saved >= baselinePopularity) {
                displayed = saved;
              }
            } catch (e) {}
            displayed += 11;
            render();

            function render() {
              label.textContent = displayed.toLocaleString('en-US');
              try { localStorage.setItem(storageKey, String(displayed)); } catch (e) {}
            }

            // If Busuanzi reports a higher shared count, sync upward.
            function syncSharedCount() {
              var value = (pvNode.textContent || '').replace(/[,，\s]/g, '');
              if (!/^\d+$/.test(value)) return;
              var pv = Number(value);
              if (!Number.isSafeInteger(pv)) return;
              var shared = baselinePopularity + 11 * Math.max(0, pv - baselinePV);
              if (shared > displayed) {
                displayed = shared;
                render();
              }
            }
            new MutationObserver(syncSharedCount).observe(
              pvNode, {childList:true, characterData:true, subtree:true}
            );
            syncSharedCount();
          })();
          </script>
          <script defer src="https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js"></script>
          <!-- WL-COUNTER-PLUS11-FROZEN-END -->"""

          updated = html[:left] + counter + html[right:]
          if updated != html:
              file.write_text(updated, encoding="utf-8")
              print("Only the popularity block was updated.")
          else:
              print("The popularity fix was already installed.")
          PY

      - name: Commit and publish fixed counter
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m "Fix popularity counter: +11 on refresh with shared-count sync"
            git push
          else
            echo "Nothing to commit"
          fi
