name: Weston Life - shared popularity counter (+11)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/westonlife-counter-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: westonlife-popularity-install
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'westonlife/westonlife-news'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install shared counter (preserve all homepage articles and layout)
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          if not path.is_file():
              raise SystemExit('STOP: index.html was not found. No homepage changes made.')
          source = path.read_text(encoding='utf-8')
          if not re.search(r'</body\s*>', source, flags=re.I):
              raise SystemExit('STOP: Closing body tag missing. No homepage changes made.')
          if '人气值' not in source:
              raise SystemExit('STOP: Popularity label missing. No homepage changes made.')

          # One server-side counter shared by every browser. The provider counts an
          # accepted GET as one event; display always uses 27,110 + 11 * events.
          # No API token is placed in the public page.
          script = r'''<script id="wl-global-popularity-v2">
          /* Weston Life: global popularity counter, 27,110 + 11 per recorded visit.
             Data is kept by counterapi.com, not in the visitor's browser.
             There is no simulated local increment if the shared service is down.
          */
          (function () {
            'use strict';
            if (window.__wlPopularityGlobalV2) return;
            window.__wlPopularityGlobalV2 = true;
            var BASE = 27110, STEP = 11;
            var ENDPOINT = 'https://counterapi.com/api/westonlife.org/view/westonlife-popularity-global-20261102-v2';
            var label, latest = -1, seq = 0;
            function numberFormat(n) { return Math.floor(n).toLocaleString('en-US'); }
            function findOldCounter() {
              var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
              var node;
              while ((node = walk.nextNode())) {
                if (!node.nodeValue.includes('人气值')) continue;
                var el = node.parentElement;
                if (!el || el.closest('script,style,noscript,template,[data-wl-global-display]')) continue;
                for (var depth = 0; depth < 4 && el; depth++, el = el.parentElement) {
                  var txt = (el.textContent || '').replace(/\s+/g, ' ').trim();
                  if (txt.includes('人气值') && txt.length <= 100 && /\b\d[\d,]*\b/.test(txt)) return el;
                }
              }
              return null;
            }
            function mount() {
              if (label) return true;
              var old = findOldCounter();
              if (!old) return false;
              var clone = old.cloneNode(false);
              clone.removeAttribute('id');
              clone.removeAttribute('onclick');
              clone.setAttribute('data-wl-global-display', 'true');
              clone.setAttribute('aria-live', 'polite');
              clone.textContent = '人气值：正在更新…';
              old.insertAdjacentElement('afterend', clone);
              old.style.display = 'none';
              label = clone;
              return true;
            }
            function showCount(n) {
              if (!Number.isSafeInteger(n) || n < 0) return;
              latest = Math.max(latest, n);
              if (mount()) label.textContent = '人气值： ' + numberFormat(BASE + STEP * latest);
            }
            function request(readOnly) {
              var callback = '__wl_counter_v2_' + (++seq) + '_' + Date.now();
              var scriptTag = document.createElement('script');
              var done = false;
              var timer = setTimeout(function () { finish(null); }, 12000);
              function finish(response) {
                if (done) return;
                done = true;
                clearTimeout(timer);
                scriptTag.remove();
                try { delete window[callback]; } catch (e) { window[callback] = undefined; }
                var value = response && Number(response.value);
                if (response && Number.isSafeInteger(value) && value >= 0) {
                  showCount(value);
                } else if (latest < 0 && mount()) {
                  label.textContent = '人气值：暂时无法更新';
                }
              }
              window[callback] = finish;
              scriptTag.onerror = function () { finish(null); };
              scriptTag.src = ENDPOINT + '?callback=' + encodeURIComponent(callback) +
                '&readOnly=' + (readOnly ? 'true' : 'false') +
                '&_=' + Date.now() + '-' + seq;
              document.head.appendChild(scriptTag);
            }
            function start() {
              if (!mount()) {
                console.warn('Weston Life: popularity label not found; preserving page.');
                return;
              }
              // One shared increment per homepage load (including reload).
              request(false);
              // Refresh any open tabs without adding more visits.
              setInterval(function () { request(true); }, 45000);
            }
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', start, {once: true});
            } else { start(); }
          })();
          </script>'''

          # Only replace THIS workflow's own script; never rewrite articles or CSS.
          pattern = re.compile(r'\s*<script\b[^>]*\bid=["\']wl-global-popularity-v2["\'][^>]*>.*?</script>\s*', re.I | re.S)
          clean = pattern.sub('', source)
          updated = re.sub(r'</body\s*>', lambda m: '\n' + script + '\n' + m.group(0), clean, count=1, flags=re.I)
          path.write_text(updated, encoding='utf-8')
          print('Updated homepage with shared counter only; articles, photographs and layout untouched.')
          PY
      - name: Commit the limited homepage change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          if git diff --cached --quiet; then
            echo 'Shared counter script already installed.'
          else
            git commit -m 'Install global shared popularity counter plus 11'
            git push origin HEAD:main
          fi
      - name: Request GitHub Pages rebuild after bot commit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/wl-pages-build.txt -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "Pages build request: HTTP ${code} (201 = accepted)."
          if [ "${code}" != '201' ]; then
            echo 'The homepage code is committed, but GitHub Pages may need a normal human commit to publish it.'
          fi
