name: Weston School Official Notices

on:
  workflow_dispatch:
  schedule:
    # Check both DST/standard UTC times, perform update only at 6:15pm Boston.
    - cron: '15 22,23 * * *'

permissions:
  contents: write

concurrency:
  group: weston-school-notices
  cancel-in-progress: false

jobs:
  school-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: clock
        name: Check Boston local hour
        run: echo "hour=$(TZ=America/New_York date +%H)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '18'
        with:
          python-version: '3.12'
      - name: Read Weston school official notices
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '18'
        run: python scripts/update_school_notices.py
      - name: Commit only school notices JSON
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '18'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school-notices.json
          if git diff --cached --quiet; then
            echo "No verified updates"
          else
            git commit -m "Update Weston School official notices"
            git pull --rebase origin main
            git push origin main
          fi
