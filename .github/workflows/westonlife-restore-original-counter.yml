name: Weston Life - restore original shared counter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/westonlife-restore-original-counter.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: westonlife-restore-original-counter
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'westonlife/westonlife-news'
    runs-on: ubuntu-latest
    steps:
      - name: Read current homepage
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Restore original Busuanzi shared count, remove conflicting V2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          filename = Path('index.html')
          if not filename.is_file():
              raise SystemExit('STOP: index.html not found. Nothing changed.')
          html = filename.read_text(encoding='utf-8')

          # Restore the original counter that was in this repository before
          # the November 2 replacement. Only the marked counter block changes.
          original = '''<!-- WL-COUNTER-PLUS11-FROZEN -->
          <div id="wl-counter" style="padding:12px 18px;background:#f5efdf;color:#315c41;font-size:14px;text-align:left;">
          <span id="busuanzi_site_pv" style="display:none">加载中…</span>
          人气值：<span id="wl-popularity">27,110</span>
          </div>
          <script>
          (function(){
            var baselinePV = 69;
            var baselinePopularity = 27110;
            var box = document.getElementById('wl-counter');
            var pvNode = document.getElementById('busuanzi_site_pv');
            var label = document.getElementById('wl-popularity');
            document.body.prepend(box);
            function update(){
              var value = pvNode.textContent.replace(/[,，\\s]/g, '');
              if(!/^\\d+$/.test(value)) return;
              var pv = Number(value);
              if(!Number.isSafeInteger(pv)) return;
              label.textContent = (baselinePopularity + 11 * Math.max(0, pv - baselinePV)).toLocaleString();
            }
            new MutationObserver(update).observe(pvNode,{childList:true,characterData:true,subtree:true});
            update();
          })();
          </script>
          <script defer src="https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js"></script>
          <!-- WL-COUNTER-PLUS11-FROZEN-END -->'''

          old_pattern = re.compile(
              r'<!-- WL-COUNTER-PLUS11-FROZEN -->[\s\S]*?<!-- WL-COUNTER-PLUS11-FROZEN-END -->',
              flags=re.I
          )
          v2_pattern = re.compile(
              r'\s*<script\s+id=["\']wl-global-popularity-v2["\'][^>]*>[\s\S]*?</script>\s*',
              flags=re.I
          )
          if len(old_pattern.findall(html)) != 1:
              raise SystemExit('STOP: original counter marker missing/duplicated. Nothing changed.')
          if len(v2_pattern.findall(html)) > 1:
              raise SystemExit('STOP: multiple unexpected new counters. Nothing changed.')
          new_html = old_pattern.sub(lambda m: original, html, count=1)
          new_html = v2_pattern.sub('\n', new_html, count=1)
          if ('wl-global-popularity-v2' in new_html or
              'id="busuanzi_site_pv"' not in new_html or
              'baselinePopularity = 27110' not in new_html or
              'weston-halloween' not in new_html.lower()):
              raise SystemExit('STOP: verification failed. Nothing changed.')
          if new_html != html:
              filename.write_text(new_html, encoding='utf-8')
              print('Original shared counter restored; conflicting V2 removed.')
          else:
              print('Original shared counter already restored.')
          PY

      - name: Save limited homepage change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          if git diff --cached --quiet; then
            echo 'No homepage modification needed.'
          else
            git commit -m 'Restore original shared popularity counter (+11)'
            git push origin HEAD:main
          fi

      - name: Request GitHub Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/wl-pages-build.txt -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "GitHub Pages build request HTTP ${status}; 201 means accepted."
