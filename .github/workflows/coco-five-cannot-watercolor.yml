      - name: Commit homepage image and article cover
        shell: bash
        run: |
          git config user.name 'Weston Life Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/coco-five-cannot-cover.jpg coco-iran-2026.html coco-opinion.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add Five Cannot watercolor homepage feature and article cover'
            git push origin HEAD:main
          else
            echo 'Cover is already installed.'
          fi
