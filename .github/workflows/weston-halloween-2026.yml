name: Weston Life · Halloween 2026 one-click feature

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weston-halloween-2026.yml'

permissions:
  contents: write

concurrency:
  group: westonlife-halloween-install
  cancel-in-progress: false

