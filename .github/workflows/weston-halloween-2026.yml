ight:1.36;margin:38px 0 15px}.quote{border-left:5px solid var(--accent);padding:16px 24px;background:#fff1e5;margin:34px 0;font-size:23px;font-weight:700}\n.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:22px 0 35px}.gallery img{width:100%;height:350px;object-fit:cover;border-radius:12px;background:#1e2028}.gallery figure:nth-child(1){grid-column:span 2}.gallery figure:nth-child(1) img{height:450px}\n.source{border-top:1px solid var(--line);padding-top:18px;margin-top:32px;font:13px/1.8 Arial,sans-serif;color:#6b736a}.back{display:inline-block;padding:12px 21px;border-radius:7px;background:#345942;color:white;text-decoration:none;font:700 14px Arial,sans-serif;margin-top:15px}\nhtml[data-wl-lang="zh"] .en{display:none !important}html[data-wl-lang="en"] .zh{display:none !important}\n@media(max-width:650px){.mast{padding:12px 16px}.gallery{grid-template-columns:1fr}.gallery figure:nth-child(1){grid-column:span 1}.gallery img,.gallery figure:nth-child(1) img{height:390px}.prose{font-size:17px}.opening{font-size:19px}}\n</style></head><body>\n<header class="mast"><a class="logo" href="index.html">Weston <b>Life</b></a><div class="langbar"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">English</button></div></header>\n<article>\n<div class="kicker">WESTON LIFE · HALLOWEEN 2026 · COMMUNITY FEATURE</div>\n<h1 class="zh">Weston“糖王一家”点亮了整个社区的万圣节之夜</h1><h1 class="en">The “Candy King” Family Lights Up Halloween for the Weston-Area Community</h1>\n<p class="deck zh">糖果成山、餐车送暖、冰激凌和节日美食齐聚——一次慷慨分享，让万圣节的快乐传遍邻里。</p><p class="deck en">Candy towers, festive food and a brightly decorated home turned Halloween into a celebration of neighborhood generosity.</p>\n<div class="meta">Weston Life · November 1, 2026 · Wellesley Hills, Massachusetts</div>\n<figure><img class="lead" src="assets/halloween-2026/house.jpg" alt="真实视频截图：万圣节夜晚，装饰灯光照亮住宅，居民在门外聚集"><figcaption class="zh">10月31日晚，灯光绚丽的房屋前挤满前来庆祝的邻居。图片取自居民分享的现场视频。</figcaption><figcaption class="en">Neighbors gather outside the brightly decorated home on October 31. Still from a community-shared video.</figcaption></figure>\n<section class="prose zh">\n<p class="opening dropcap">10月31日万圣节之夜，Wellesley Hills 一户被 Weston 地区华人居民亲切称为“糖王家”的家庭，凭着满满的糖果、节日布置和慷慨的美食招待，在邻里之间引发热烈讨论。对许多孩子来说，这是寻找糖果的夜晚；而对在场的家庭来说，这里更像一场向整个社区敞开大门的节日聚会。</p>\n<h2>灯光、人群与孩子们的欢呼</h2>\n<p>居民分享的现场视频呈现出格外热闹的场面：住宅外墙与庭院闪烁着紫色、红色和橙色的万圣节灯光，装扮成各种角色的孩子们与家长穿过人群，沿着步道走向布置一新的门廊。镜头中，邻居们不断停下脚步观看、拍照，节日气息几乎从画面中溢出来。</p>\n<h2>不只是讨糖：像一场节日嘉年华</h2>\n<p>最引人注目的是门口大批摆放整齐的糖果，现场视频还记录了餐车和美食供应的场景。Weston 社区微信群成员在10月31日傍晚分享了“免费冰激凌”“免费 Chick-fil-A”等消息，并称现场还有热狗、炸鸡及其他饮品，由主人招待。上述具体供应品类来自居民即时分享，并非逐项独立核实的活动清单。</p>\n<p>当一场普通的挨家挨户要糖活动，变成灯光、糖果、餐点和邻里互动齐聚的狂欢，最令人印象深刻的，已不再是拿到了多少糖果，而是主人愿意花心思，把快乐送给每一位到来的邻居。</p>\n<div class="quote">“糖王一家”最动人的地方，不是糖果有多少，而是把节日的欢乐慷慨地分享给整个社区。</div>\n<h2>一户人家的热情，成为邻里的共同记忆</h2>\n<p>当天晚上，社区群里有人实时上传视频、询问地点，也有人呼唤朋友带孩子赶来。热心居民的口耳相传，让这处节日现场成为附近家庭谈论的话题。</p>\n<p>值得一提的是，现场位于 <strong>Wellesley Hills</strong>，并非 Weston 镇内；不过，它在 Weston 邻里社群中广泛传播，让两个相邻社区的家庭共同分享万圣节的欢乐。Weston Life 记录这份民间自发的慷慨，不是为了比较谁家的糖果最多，而是为了记住这种用行动连接邻居的社区精神。</p>\n<p><strong>一个家庭点亮一座房子，一份善意温暖一群邻居——这就是今年万圣节最可贵的风景。</strong></p>\n</section>\n<section class="prose en">\n<p class="opening dropcap">On Halloween night, October 31, a Wellesley Hills home affectionately nicknamed the “Candy King” house by members of the Weston-area Chinese community became a much-talked-about neighborhood destination. With an illuminated facade, generous sweets and festive hospitality, the gathering felt like more than a traditional stop for trick-or-treating.</p>\n<h2>Lights, costumes and a memorable evening</h2>\n<p>Resident-shared videos show purple, orange and red decorations glowing across the home and garden. Costumed children and accompanying adults gathered along the walkway, while visitors stopped to admire the decorations and capture the moment.</p>\n<h2>More than a handful of candy</h2>\n<p>Footage shows large displays of sweets near the front entrance, as well as a food truck. Posts shared in a Weston neighborhood chat on October 31 mentioned complimentary ice cream, Chick-fil-A food and other refreshments, including hot dogs and chicken. Those menu details are attributed to residents\' posts and have not been individually verified by Weston Life.</p>\n<p>What made the evening special was not simply the quantity of candy or food. It was the idea that one household could turn a familiar holiday tradition into an occasion for neighbors to meet, smile and celebrate together.</p>\n<div class="quote">The sweetest part of Halloween was the generosity that brought neighbors together.</div>\n<h2>Community spirit crossing town lines</h2>\n<p>The gathering took place in <strong>Wellesley Hills, not within the Town of Weston</strong>. Yet the videos and recommendations circulated through the Weston community, reflecting the close ties between neighboring towns.</p>\n<p>The home became part of this Halloween\'s shared community memories: bright lights, happy faces and a simple act of making others feel welcome.</p>\n</section>\n<h2 class="zh">📷 真实现场影像 · 更多照片</h2><h2 class="en">📷 More real photos from Halloween night</h2>\n<div class="gallery">\n<figure><img loading="lazy" src="assets/halloween-2026/crowd.jpg" alt="万圣节居民聚集的真实画面"><figcaption class="zh">装扮好的孩子与邻居们，聚集在灯光璀璨的房屋门前。</figcaption><figcaption class="en">Families and costumed children outside the home.</figcaption></figure>\n<figure><img loading="lazy" src="assets/halloween-2026/candy.jpg" alt="万圣节入口的糖果堆"><figcaption class="zh">门口堆叠的糖果展示，成为大家讨论的焦点。</figcaption><figcaption class="en">Towering displays of Halloween candy near the front entrance.</figcaption></figure>\n<figure><img loading="lazy" src="assets/halloween-2026/foodtruck.jpg" alt="现场美食餐车"><figcaption class="zh">活动现场的视频中可以看到餐车及美食供应。</figcaption><figcaption class="en">A food truck captured in the neighborhood videos.</figcaption></figure>\n<figure><img loading="lazy" src="assets/halloween-2026/decoration.jpg" alt="万圣节灯光与房屋"><figcaption class="zh">精心布置的门廊、节日色彩和万圣节灯饰。</figcaption><figcaption class="en">A decorated front entrance glowing in festive colors.</figcaption></figure>\n<figure><img loading="lazy" src="assets/halloween-2026/display.jpg" alt="恐怖主题装饰"><figcaption class="zh">庭院里令人印象深刻的万圣节主题陈设。</figcaption><figcaption class="en">A theatrical Halloween display in the yard.</figcaption></figure>\n</div>\n<div class="source"><span class="zh">素材说明：所有照片均从你提供的2026年10月31日晚现场视频中截取，未使用 AI 合成或其他地点的图片。食品种类与“糖王家”昵称来自 Weston 社区聊天记录。现场位于 Wellesley Hills；为尊重私人住宅与家庭隐私，本文不公开具体门牌。公开转载居民拍摄的视频截图，仍应取得原拍摄者许可。</span><span class="en">Sources: All images are stills from community-supplied footage of October 31, 2026; none are AI-generated or photos from other locations. Food descriptions and the nickname are from residents\' chat messages. The home is in Wellesley Hills; its street address is withheld to respect the privacy of a private residence. Please obtain permission from the original videographers before publication.</span></div>\n<a class="back zh" href="index.html">← 返回 Weston Life 新闻首页</a><a class="back en" href="index.html">← Back to Weston Life</a>\n</article>\n<script>(function(){var selected=\'zh\';try{selected=localStorage.getItem(\'westonlife-lang\')===\'en\'?\'en\':\'zh\'}catch(e){}function select(x){document.documentElement.setAttribute(\'data-wl-lang\',x);document.documentElement.lang=x===\'en\'?\'en\':\'zh-CN\';document.querySelectorAll(\'[data-lang]\').forEach(function(b){b.classList.toggle(\'active\',b.dataset.lang===x)});try{localStorage.setItem(\'westonlife-lang\',x)}catch(e){}}document.querySelectorAll(\'[data-lang]\').forEach(function(b){b.addEventListener(\'click\',function(){select(b.dataset.lang)})});select(selected)})();</script>\n</body></html>'
